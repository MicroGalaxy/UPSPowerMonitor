name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\UPSPowerMonitor.sln --disable-parallel

      - name: Build
        run: dotnet build .\UPSPowerMonitor.sln -c Release --no-restore -m:1

      - name: Publish self-contained package
        run: >-
          dotnet publish .\UPSPowerMonitor.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o .\artifacts\win-x64

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: UPSPowerMonitor-win-x64
          path: .\artifacts\win-x64\**
          if-no-files-found: error
          retention-days: 14
